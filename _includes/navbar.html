<header id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div id="navbar-inner" class="flex items-center justify-between">
      <a href="{{ '/' | relative_url }}" class="flex-shrink-0">
        <img id="navbar-logo" src="{{ '/assets/images/logo-jm-nutrition.png' | relative_url }}" alt="{{ site.data.site.name }}">
      </a>

      <nav class="hidden lg:flex items-center gap-8">
        {% for link in site.data.nav %}
        <a href="{{ link.href }}" class="text-sm font-medium text-dark/80 hover:text-primary transition-colors">{{ link.label }}</a>
        {% endfor %}
      </nav>

      <div class="hidden lg:flex items-center gap-4">
        <a href="{{ site.data.site.phone_link }}" class="flex items-center gap-2 text-sm font-medium text-dark/80 hover:text-primary transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          {{ site.data.site.phone }}
        </a>
        <a href="{{ site.data.site.doctolib }}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 bg-primary hover:bg-primary-dark text-white px-5 py-2.5 rounded-full text-sm font-semibold transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Prendre RDV
        </a>
      </div>

      <button id="menu-toggle" class="lg:hidden p-2 rounded-md text-dark" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu">
        <svg id="menu-open-icon" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg id="menu-close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="lg:hidden hidden bg-white/95 backdrop-blur-md border-t border-gray-100">
    <div class="px-4 py-6 space-y-4">
      {% for link in site.data.nav %}
      <a href="{{ link.href }}" class="mobile-nav-link block text-lg font-medium text-dark/80 hover:text-primary transition-colors py-2">{{ link.label }}</a>
      {% endfor %}
      <hr class="border-gray-200">
      <a href="{{ site.data.site.phone_link }}" class="flex items-center gap-2 text-dark/80">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        {{ site.data.site.phone }}
      </a>
      <a href="{{ site.data.site.doctolib }}" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-2 w-full bg-primary hover:bg-primary-dark text-white px-5 py-3 rounded-full font-semibold transition-colors">
        Prendre RDV sur Doctolib
      </a>
    </div>
  </div>
</header>
