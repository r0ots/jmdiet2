<section id="faq" class="py-20 bg-beige">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="font-heading text-3xl sm:text-4xl font-bold text-dark text-center mb-16 scroll-reveal">Questions fréquentes</h2>
    <div class="space-y-4">
      {% for item in site.data.faq %}
      <details class="scroll-reveal group bg-white rounded-xl shadow-sm">
        <summary class="flex items-center justify-between cursor-pointer p-4 sm:p-6 font-semibold text-dark select-none">
          <span>{{ item.question }}</span>
          <span class="faq-icon ml-4 flex-shrink-0 w-6 h-6 rounded-full bg-primary/10 text-primary flex items-center justify-center transition-transform duration-300 group-open:rotate-45">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </span>
        </summary>
        <div class="faq-content px-4 sm:px-6 pb-4 sm:pb-6 text-dark/60 leading-relaxed">
          {{ item.answer | markdownify }}
        </div>
      </details>
      {% endfor %}
    </div>
  </div>
</section>
