<section id="parcours" class="py-20 bg-cream">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="font-heading text-3xl sm:text-4xl font-bold text-dark text-center mb-16 scroll-reveal">Votre parcours en 3 étapes</h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
      {% for step in site.data.journey %}
      <div class="scroll-reveal bg-white rounded-2xl p-8 shadow-md hover:shadow-xl transition-all duration-300 relative">
        <span class="absolute -top-5 left-8 w-10 h-10 bg-primary text-white rounded-full flex items-center justify-center font-heading font-bold text-lg">{{ step.number }}</span>
        <h3 class="font-heading font-semibold text-dark text-xl mt-4 mb-4">{{ step.title }}</h3>
        <p class="text-sm text-dark/60 mb-1"><strong>Durée :</strong> {{ step.duration }}</p>
        <p class="text-sm text-dark/60 mb-4"><strong>{{ step.format_label | default: "Format" }} :</strong> {{ step.format }}</p>
        <p class="text-dark/60 leading-relaxed">{{ step.description }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
