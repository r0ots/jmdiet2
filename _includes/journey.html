<section id="parcours" class="relative pt-14 pb-28 bg-cream overflow-hidden">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
    <h2 class="font-heading text-3xl sm:text-4xl font-bold text-center mb-16 scroll-reveal"><span class="gradient-text">Votre parcours en 3 étapes</span></h2>
    <div class="stagger-reveal grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
      {% for step in site.data.journey %}
      <div class="tilt-card bg-white rounded-2xl p-8 shadow-primary-md hover:shadow-primary-lg transition-all duration-300 relative">
        <span class="absolute -top-5 left-8 w-10 h-10 bg-gradient-to-br from-primary to-accent text-white rounded-full flex items-center justify-center font-heading font-bold text-lg shadow-primary-md">{{ step.number }}</span>
        <h3 class="font-heading font-semibold text-dark text-xl mt-4 mb-4">{{ step.title }}</h3>
        <p class="text-sm text-dark/60 mb-1"><strong>Durée :</strong> {{ step.duration }}</p>
        <p class="text-sm text-dark/60 mb-4"><strong>{{ step.format_label | default: "Format" }} :</strong> {{ step.format }}</p>
        <p class="text-dark/60 leading-relaxed">{{ step.description }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
  <div class="wave-divider bottom">
    <svg viewBox="0 0 1440 70" preserveAspectRatio="none" fill="white"><path d="M0,30 C480,70 960,0 1440,40 L1440,70 L0,70 Z"/></svg>
  </div>
</section>
