<section id="avis" class="relative pt-14 pb-28 bg-accent overflow-hidden">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
    <h2 class="font-heading text-3xl sm:text-4xl font-bold text-dark text-center mb-16 scroll-reveal">Témoignages</h2>
    <div class="stagger-reveal grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
      {% for testimonial in site.data.testimonials %}
      <div class="tilt-card bg-white rounded-2xl p-8 shadow-accent-lg hover:-translate-y-2 transition-all duration-300">
        <svg class="w-8 h-8 text-accent/40 mb-4" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/></svg>
        <p class="italic text-dark leading-relaxed mb-6">{{ testimonial.quote }}</p>
        <p class="font-semibold text-primary text-right">— {{ testimonial.author }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
  <div class="wave-divider bottom">
    <svg viewBox="0 0 1440 70" preserveAspectRatio="none" fill="#F5F0EB"><path d="M0,30 C480,70 960,0 1440,40 L1440,70 L0,70 Z"/></svg>
  </div>
</section>
