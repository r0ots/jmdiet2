<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ site.url }}">
<meta property="og:site_name" content="{{ site.data.site.name }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ site.url }}/assets/images/logo-jm-nutrition.png">
<meta property="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ '/assets/images/logo-jm-nutrition.png' | relative_url }}" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/assets/images/logo-jm-nutrition.png' | relative_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: { DEFAULT: '#E07850', dark: '#D4623A' },
        accent: '#F4B942',
        dark: '#3D2C4E',
        cream: '#FFF8F0',
        beige: '#F5F0EB'
      },
      fontFamily: {
        heading: ['Poppins', 'sans-serif'],
        body: ['Inter', 'sans-serif']
      }
    }
  }
}
</script>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
