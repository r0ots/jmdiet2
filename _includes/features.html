<section id="features" class="relative z-10 py-16 bg-primary">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
      {% for feature in site.data.features %}
      <div class="scroll-reveal bg-white rounded-2xl p-6 shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
        <img src="{{ feature.icon | relative_url }}" alt="{{ feature.title }}" class="w-16 h-16 mb-4" loading="lazy">
        <h3 class="font-heading font-semibold text-dark text-lg mb-2">{{ feature.title }}</h3>
        <p class="text-sm text-dark/60 leading-relaxed">{{ feature.description }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
